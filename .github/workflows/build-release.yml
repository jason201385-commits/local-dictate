name: Build Windows release

# 打 tag 就出一版；也可以手動觸發做煙霧測試。
# 公開 repo 用標準 GitHub-hosted runner 不計 Actions 費用。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝相依（不含 CUDA）
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # 刻意過濾掉 nvidia-* ：那三個裝完約 1.9GB，而且是 proprietary 授權，
          # 能不能重新散布要另外確認。GPU 加速留給安裝後選配。
          (Get-Content requirements.txt) |
            Where-Object { $_ -notmatch '^\s*nvidia-' } |
            Set-Content requirements-ci.txt
          python -m pip install -r requirements-ci.txt
          python -m pip install pyinstaller

      - name: 靜態檢查
        shell: pwsh
        run: |
          python -m py_compile dictate.py doctor.py tune.py setup_shortcuts.py
          Write-Host "compile OK"

      - name: 純函式測試（不需要麥克風／GPU）
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/test_pure.py

      # 一定要在打包**之前**跑：spec 會把 licenses/ 與 THIRD_PARTY_NOTICES.md 收進產物，
      # 所以清單必須先反映「這一次 build 實際裝了什麼版本」。
      # 手工維護出過兩種錯（v0.1.3）：漏掉相依進來的 click、版本號寫成開發機的。
      - name: 產生第三方元件清單（從實際安裝環境）
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python build/gen_notices.py --write
          if ($LASTEXITCODE -ne 0) { throw "gen_notices 失敗，exit $LASTEXITCODE" }
          $n = (Get-ChildItem licenses -File | Measure-Object).Count
          Write-Host "licenses/ 共 $n 份授權原文"
          if ($n -lt 20) { throw "授權原文只有 $n 份，明顯不對（預期 30+）" }

      - name: PyInstaller 打包
        shell: pwsh
        env:
          # runner 的 stdout 預設是 cp1252，spec 裡的中文 print 會噴
          # UnicodeEncodeError 讓整個 build exit 1（2026-07-30 實際發生）。
          # spec 內另有 _say() 做第二層保險。
          PYTHONIOENCODING: utf-8
        run: python -m PyInstaller build/local-dictate.spec --noconfirm

      # ⚠️ 這一步是 v0.1.3 的教訓：那一版 CI 全綠、release 也出了，
      #    但 portable.zip 裡**沒有任何授權檔**——因為 zip 是直接壓 dist\，
      #    而授權檔當時只透過 installer.iss 進安裝檔。綠燈完全沒有察覺。
      #    「宣稱有附授權文」必須被驗證，不能只寫在 README 裡。
      - name: 斷言授權文件真的在產物裡
        shell: pwsh
        run: |
          $d = "dist\local-dictate"
          foreach ($f in "THIRD_PARTY_NOTICES.md", "LGPL-COMPLIANCE.md", "LICENSE") {
            if (!(Test-Path (Join-Path $d $f))) { throw "產物缺少 $f —— 檢查 build/local-dictate.spec 的 datas" }
          }
          $lic = Get-ChildItem (Join-Path $d "licenses") -File -ErrorAction SilentlyContinue
          if (!$lic -or $lic.Count -lt 20) { throw "產物的 licenses\ 只有 $($lic.Count) 份，預期 20 份以上" }
          # LGPL 元件的授權全文一定要在（pynput 是 LGPL-3.0、FFmpeg 是 LGPL-2.1+）
          foreach ($f in "LGPL-3.0.txt", "LGPL-2.1.txt", "GPL-3.0.txt") {
            if (!(Test-Path (Join-Path $d "licenses\$f"))) { throw "缺 LGPL 必附全文：$f" }
          }
          Write-Host "授權文件斷言全過：3 份頂層文件 + $($lic.Count) 份授權原文"

      # ⚠️ 這一步守的是**授權相容性**，不是體積。
      #    PyAV 的 Windows wheel 內含 libx264 / libx265，兩者都是 GPL-2.0-or-later
      #    （從 avcodec DLL 抽出的 FFmpeg 組態字串：--enable-version3 --enable-libx264 --enable-libx265）。
      #    把它們跟本程式放進同一個安裝檔散布，整包就要依 GPL 條款走並提供對應原始碼，
      #    「本專案 MIT，拿去賣都可以」那句話會對二進位版變成錯的。
      #    v0.1.3 曾經散布過它們，而且文件寫著「不含 x264/x265」—— 說法與事實相反。
      #    即時聽寫用不到 FFmpeg（音訊是 numpy array 直接進模型），所以直接不打包。
      #    只要有人把 av 加回相依、或哪天 hook 失效，這一步就會擋下 release。
      - name: 斷言產物不含 GPL 編碼器（x264 / x265 / FFmpeg）
        shell: pwsh
        run: |
          $bad = Get-ChildItem dist\local-dictate -Recurse -File |
                 Where-Object { $_.Name -match '(?i)(x264|x265|avcodec|avformat|avfilter|avdevice|swscale|swresample|dav1d|SvtAv1)' }
          if ($bad) {
            Write-Host "=== 不該出現的檔案 ==="
            $bad | ForEach-Object { Write-Host "  $($_.FullName)  $([math]::Round($_.Length/1MB,1)) MB" }
            throw "產物含 GPL/FFmpeg 二進位共 $($bad.Count) 個 —— 見 build/rthook_no_av.py"
          }
          Write-Host "產物不含任何 FFmpeg / x264 / x265 二進位 ✅"

      # 「不打包 CUDA」這句話在 spec、CI 註解、NOTICES 都寫了很多年，但 v0.1.3(含)以前
      # 產物裡一直有 cudnn64_9.dll —— 因為那道防線只擋 pip 的 nvidia-* 套件，
      # 擋不掉「ctranslate2 的 wheel 自己夾帶」。而且第一次修的時候只濾了 collect_dynamic_libs，
      # collect_data_files 又把同一顆 DLL 收回來，spec 還是印出「已排除」。
      # 結論：宣稱要由**產物**驗證，不能由設定或訊息驗證。
      - name: 斷言產物不含 NVIDIA 專有二進位
        shell: pwsh
        run: |
          $bad = Get-ChildItem dist\local-dictate -Recurse -File |
                 Where-Object { $_.Name -match '(?i)(cudnn|cublas|cudart|cufft|curand|cusolver|cusparse|nvrtc)' }
          if ($bad) {
            Write-Host "=== 不該出現的檔案 ==="
            $bad | ForEach-Object { Write-Host "  $($_.FullName)  $([math]::Round($_.Length/1MB,2)) MB" }
            throw "產物含 NVIDIA 專有二進位 $($bad.Count) 個 —— 與『不打包 CUDA』的宣稱不符"
          }
          Write-Host "產物不含 NVIDIA 專有二進位 ✅"

      - name: 確認產物存在且能顯示版本
        shell: pwsh
        run: |
          $exe = "dist\local-dictate\local-dictate.exe"
          if (!(Test-Path $exe)) { throw "找不到產物 $exe" }
          $mb = [math]::Round((Get-ChildItem dist\local-dictate -Recurse -File |
                Measure-Object Length -Sum).Sum / 1MB, 1)
          Write-Host "onedir 大小: $mb MB"
          # ⚠️ CI 沒有麥克風也沒有互動桌面，這裡不啟動 GUI；
          #    真正的啟動/錄音/貼上測試必須在實機上做。

      - name: 下載要內建的 base 模型（讓首次啟動不用等下載）
        shell: pwsh
        run: |
          # base 約 141MB。刻意不用 tiny：本機實測 base 已經會把英文品牌名
          # 聽成不相干的中文，tiny 只會更糟，第一印象就毀了。
          # 也刻意不內建 medium：1.5GB 會讓每次改版都重傳一次。
          python -c @"
          from huggingface_hub import snapshot_download
          p = snapshot_download('Systran/faster-whisper-base',
                                local_dir='build/bundled-model/models--Systran--faster-whisper-base')
          print('downloaded to', p)
          "@
          $mb = [math]::Round((Get-ChildItem build\bundled-model -Recurse -File |
                Measure-Object Length -Sum).Sum / 1MB, 1)
          Write-Host "內建模型大小: $mb MB"

      - name: 建 Inno Setup 安裝器
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            Write-Warning "找不到 Inno Setup，跳過安裝器（portable zip 仍會上傳）"
            exit 0
          }
          # runner 上的 Inno Setup 6.7.1 的 Languages\ 沒有繁中檔
          # （2026-07-26 CI 實際踩到：Couldn't open include file ChineseTraditional.isl）。
          # 從 issrc 原始碼倉庫抓（已實測此網址可用、內容為 6.5.0+ 繁中語系檔）。
          # 抓不到就讓 installer.iss 的 FileExists 判斷退成英文版 ——
          # 一個翻譯檔不該有能力擋掉整個 release。
          $ProgressPreference = 'SilentlyContinue'
          $lang = "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseTraditional.isl"
          if (!(Test-Path $lang)) {
            $url = "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseTraditional.isl"
            try {
              Invoke-WebRequest $url -OutFile $lang -TimeoutSec 30 -UseBasicParsing
              Write-Host "已取得繁體中文語系檔 ($([math]::Round((Get-Item $lang).Length/1KB,1)) KB)"
            } catch {
              Write-Warning "抓不到繁中語系檔，安裝器只出英文：$($_.Exception.Message)"
            }
          }
          # 版本號從 tag 取，不要寫死在 .iss 裡
          $ver = "$env:GITHUB_REF_NAME" -replace '^v', ''
          if ($ver -notmatch '^\d+\.\d+(\.\d+)?') { $ver = "0.0.0" }
          Write-Host "安裝器版本: $ver"
          & $iscc "/DAppVersion=$ver" build\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 失敗，exit $LASTEXITCODE" }

      - name: 產生 SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path dist\local-dictate\* -DestinationPath artifacts\local-dictate-portable.zip -Force
          Get-ChildItem dist\*.exe -ErrorAction SilentlyContinue | Copy-Item -Destination artifacts
          # ⚠️ 先把清單抓完再寫檔。舊寫法是邊 Get-ChildItem 邊 -Append 寫進同一個目錄，
          #    SHA256SUMS.txt 會在列舉途中被建立而**把自己也算進去**，而且重跑會累加。
          $files = Get-ChildItem artifacts -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' }
          $lines = $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" }
          $lines | Set-Content artifacts\SHA256SUMS.txt -Encoding utf8
          Get-Content artifacts\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: local-dictate-windows
          path: artifacts/

  # ── 乾淨機驗證 ────────────────────────────────────────────────────────
  # 開發機有一堆「剛好裝過」的東西，本機測過 ≠ 裝得起來。
  # 這個 job 跑在**另一台**乾淨 runner 上：只拿安裝檔，不 checkout 原始碼、
  # 不裝 Python 相依——就是使用者拿到的環境。
  # 驗不到的（誠實邊界）：麥克風（runner 沒有）、實際貼上、GPU。
  # 但「安裝→啟動→模型載入→熱鍵註冊→解除安裝」這條最常斷的路驗得到。
  verify-install:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15        # 任何一步卡住不准拖滿 6 小時（2026-07-29 實際發生 35 分鐘懸掛）
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: local-dictate-windows
          path: artifacts

      - name: 靜默安裝
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts\local-dictate-setup-*.exe | Select-Object -First 1
          if (!$setup) { Write-Warning "沒有安裝檔（Inno 可能被跳過），改驗 portable"; exit 0 }
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "安裝失敗 exit $($p.ExitCode)" }
          "installed=1" | Out-File $env:GITHUB_ENV -Append

      - name: 啟動並驗證（模擬第一次使用）
        if: env.installed == '1'
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA "Programs\local-dictate\local-dictate.exe"
          if (!(Test-Path $exe)) {
            # per-user 安裝的另一個可能位置
            $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter local-dictate.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (!$exe -or !(Test-Path $exe)) { throw "找不到安裝後的執行檔" }
          Start-Process $exe
          Start-Sleep -Seconds 45
          $proc = Get-Process -Name local-dictate -ErrorAction SilentlyContinue
          $log = Join-Path $env:LOCALAPPDATA "local-dictate\dictate.log"
          Write-Host "--- dictate.log ---"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "(沒有 log)" }
          # 斷言 1：程序活著（麥克風失敗也必須優雅降級，不能整個死掉）
          if (!$proc) { throw "程序沒有存活" }
          $content = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
          # 斷言 2：模型載入成功（內建 base → 不需要網路下載）
          if ($content -notmatch "模型就緒") { throw "模型沒有載入" }
          # 斷言 3：第一次啟動不應該在下載主模型（內建承諾）
          # ⚠️ 舊版比對「首次下載語音模型」—— 那串只存在於面板 UI 的顏色表（dictate.py:1173），
          #    從來不會寫進 log，所以這條斷言永遠不會觸發，是空包彈（2026-07-30 審查抓到）。
          #    真正會寫進 log 的是「本機還沒有 <size> 模型，開始下載」。
          if ($content -match "本機還沒有.*模型，開始下載") {
            throw "違反『第一次啟動零下載』承諾 —— 內建模型沒有被正確安裝"
          }
          # 斷言 4：熱鍵有註冊，而且**不是 0 組**
          # ⚠️ 舊版只比對「已註冊」，但 log 寫的是「已註冊 N 組」，N=0 時照樣通過。
          if ($content -notmatch "已註冊\s*(\d+)\s*組") { throw "log 裡沒有熱鍵註冊紀錄" }
          $regd = [int]$Matches[1]
          if ($regd -lt 1) { throw "熱鍵註冊了 0 組 —— 使用者會拿到一個按了沒反應的版本" }
          Write-Host "熱鍵註冊 $regd 組"
          # 斷言 5：設定與字典有落位
          foreach ($f in "config.json","vocab.txt") {
            if (!(Test-Path (Join-Path $env:LOCALAPPDATA "local-dictate\$f"))) { throw "缺 $f" }
          }
          # 斷言 6：授權文件跟著安裝到使用者機器上（v0.1.3 漏掉的那一項）
          #         前面的產物斷言只證明 dist\ 有；這裡證明**安裝之後**使用者手上也有。
          $appdir = Split-Path $exe -Parent
          foreach ($f in "THIRD_PARTY_NOTICES.md","LGPL-COMPLIANCE.md","LICENSE") {
            if (!(Test-Path (Join-Path $appdir $f))) { throw "安裝後缺授權文件 $f" }
          }
          $ilic = Get-ChildItem (Join-Path $appdir "licenses") -File -ErrorAction SilentlyContinue
          if (!$ilic -or $ilic.Count -lt 20) { throw "安裝後 licenses\ 只有 $($ilic.Count) 份" }
          Write-Host "六項斷言全過（背景模型升級下載屬預期，不影響斷言 3）"
          Stop-Process -Name local-dictate -Force

      - name: 靜默解除安裝並驗證清乾淨
        if: env.installed == '1'
        shell: pwsh
        timeout-minutes: 6
        run: |
          # ⚠️ 兩個都踩過（2026-07-29）：
          #    1. 不要 -Recurse 掃 Programs 找 unins*.exe——會抓到別家軟體（Run #5 懸掛）
          #    2. 不要 -Wait 乾等——解除安裝器懸掛時你只會拿到 timeout，什麼證據都沒有
          #       （Run #7 懸掛 13m46s）。改成輪詢＋逾時吐證據：log、程序清單全印出來。
          $appdir = Join-Path $env:LOCALAPPDATA "Programs\local-dictate"
          $unins = Join-Path $appdir "unins000.exe"
          if (!(Test-Path $unins)) { throw "找不到解除安裝程式：$unins" }
          $ulog = Join-Path $env:TEMP "uninst.log"
          Start-Process $unins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$ulog"
          $gone = $false
          foreach ($i in 1..36) {          # 最多 3 分鐘
            Start-Sleep -Seconds 5
            if (!(Test-Path (Join-Path $appdir "local-dictate.exe"))) { $gone = $true; break }
          }
          if (!$gone) {
            Write-Host "=== 解除安裝逾時，屍檢 ==="
            Write-Host "--- uninstaller log ---"
            if (Test-Path $ulog) { Get-Content $ulog } else { Write-Host "(沒有 log)" }
            Write-Host "--- 相關程序 ---"
            Get-Process | Where-Object { $_.ProcessName -match 'unins|_iu|local-dictate' } |
              Format-Table Id, ProcessName, StartTime -AutoSize | Out-String | Write-Host
            throw "解除安裝 3 分鐘內沒有完成"
          }
          Write-Host "解除安裝乾淨"
          if (Test-Path $ulog) { Write-Host "--- uninstaller log（成功）---"; Get-Content $ulog | Select-Object -Last 10 }

      # portable zip 從打包那天起沒有任何一步打開過，release 卻叫人「解壓後執行」。
      # 這裡至少驗它解得開、該有的檔案都在（授權文件是 v0.1.3 真的漏掉的那一項）。
      - name: 驗證 portable zip（解得開、內容齊全）
        shell: pwsh
        run: |
          $zip = "artifacts\local-dictate-portable.zip"
          if (!(Test-Path $zip)) { throw "找不到 $zip" }
          $dst = "portable-check"
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          if (!(Test-Path "$dst\local-dictate.exe")) { throw "portable zip 裡沒有 local-dictate.exe" }
          foreach ($f in "THIRD_PARTY_NOTICES.md", "LGPL-COMPLIANCE.md", "LICENSE") {
            if (!(Test-Path "$dst\$f")) { throw "portable zip 缺授權文件 $f（v0.1.3 就是漏在這裡）" }
          }
          $n = (Get-ChildItem "$dst\licenses" -File -ErrorAction SilentlyContinue | Measure-Object).Count
          if ($n -lt 20) { throw "portable zip 的 licenses\ 只有 $n 份" }
          Write-Host "portable zip 驗證通過：exe + 3 份頂層文件 + $n 份授權原文"

  # ── 發佈 ──────────────────────────────────────────────────────────────
  # ⚠️ release 必須是**獨立 job 且 needs verify-install**。
  #    舊版把發佈放在 build job 的最後一步，而 verify-install 是 needs: build ——
  #    也就是 release 早就發出去了，驗證才開始跑。驗證失敗擋不掉任何東西，
  #    再多斷言也只是裝飾（2026-07-30 合規審查抓到的結構性問題）。
  release:
    needs: [build, verify-install]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: local-dictate-windows
          path: artifacts

      - name: 發佈 release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            ### 安裝
            下載 `local-dictate-setup-*.exe`，雙擊安裝。**不需要 Python。**

            免安裝版：`local-dictate-portable.zip`，解壓後執行 `local-dictate.exe`。

            ### 注意
            - 這一版**不含 GPU 加速**（CUDA 元件約 1.9GB，另外提供）
            - **不含 FFmpeg**：PyAV 的 wheel 內含 GPL 授權的 x264／x265，而即時聽寫用不到它們。要從音檔轉錄請從原始碼執行。詳見 `THIRD_PARTY_NOTICES.md`
            - 出廠內建 base 模型；啟動後會**背景下載更適合你硬體的模型並自動切換**
            - Windows 可能顯示「不明發行者」——原因與程式要做的事寫在 README
            - 校驗碼見 `SHA256SUMS.txt`

            ### 授權
            本程式 MIT。安裝包內含第三方元件，各依其原授權散布——完整清單與授權原文隨程式一起安裝
            （`THIRD_PARTY_NOTICES.md` 與 `licenses\`），也可在 repo 內查看。
            其中 `pynput` 為 LGPL-3.0，替換方式見 `LGPL-COMPLIANCE.md`。
