<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Microsoft JhengHei UI','PingFang TC','Noto Sans TC',sans-serif">
  <rect width="880" height="560" rx="12" fill="#0d1117"/>

  <text x="40" y="52" fill="#e6edf3" font-size="26" font-weight="700">小面板怎麼用</text>
  <text x="40" y="80" fill="#8b949e" font-size="14">整個工具就這一個小視窗，永遠浮在螢幕角落。點一下開始講、再點一下結束。</text>

  <!-- ============ 待命 ============ -->
  <text x="40" y="126" fill="#7ee787" font-size="14" font-weight="700">① 待命</text>
  <g transform="translate(40,140)">
    <rect width="380" height="110" rx="8" fill="#2b2f36" stroke="#555" stroke-width="1.5"/>
    <text x="18" y="44" fill="#e6e6e6" font-size="19" font-weight="700">🎤 點我開始講話</text>
    <text x="18" y="76" fill="#9aa0a6" font-size="13">講完再點一下</text>
    <text x="352" y="28" fill="#888" font-size="14">✕</text>
    <text x="212" y="82" fill="#7ee787" font-size="13">✨整理</text>
    <text x="292" y="82" fill="#888888" font-size="13">⏎送出</text>
  </g>
  <text x="440" y="168" fill="#8b949e" font-size="13">滑鼠點面板本體 → 開始錄音</text>
  <text x="440" y="192" fill="#8b949e" font-size="13">或按熱鍵 <tspan fill="#e6edf3" font-weight="700">Ctrl+Alt+Z</tspan>（手不用離開鍵盤）</text>
  <text x="440" y="222" fill="#7ee787" font-size="13">✨整理 亮綠色＝進輸入框前先去掉「嗯、那個」、補標點</text>
  <text x="440" y="242" fill="#8b949e" font-size="13">⏎送出 亮綠色＝貼上後自動按 Enter（跟 AI 對話時很順）</text>

  <!-- ============ 錄音中 ============ -->
  <text x="40" y="296" fill="#ff7b72" font-size="14" font-weight="700">② 錄音中</text>
  <g transform="translate(40,310)">
    <rect width="380" height="110" rx="8" fill="#8b1e1e" stroke="#c14b4b" stroke-width="1.5"/>
    <text x="18" y="44" fill="#ffffff" font-size="19" font-weight="700">● 錄音中 → Claude Code</text>
    <text x="18" y="76" fill="#ffd7d7" font-size="13" font-family="monospace">████████▁▁▁▁</text>
    <text x="150" y="76" fill="#ffd7d7" font-size="13">收音中</text>
    <text x="352" y="28" fill="#fff" font-size="14">✕</text>
  </g>
  <text x="440" y="342" fill="#e6edf3" font-size="13" font-weight="700">最大那行字＝「字會去哪」</text>
  <text x="440" y="362" fill="#8b949e" font-size="13">會即時跟著焦點跑。不對就在面板上按<tspan fill="#ff7b72" font-weight="700">右鍵取消</tspan>。</text>
  <text x="440" y="392" fill="#e6edf3" font-size="13" font-weight="700">音量條＝「有沒有聽到你」</text>
  <text x="440" y="412" fill="#8b949e" font-size="13">不會動就是麥克風沒收到音，不用講完才發現。</text>

  <!-- ============ 完成 ============ -->
  <text x="40" y="466" fill="#7ee787" font-size="14" font-weight="700">③ 完成</text>
  <g transform="translate(40,480)">
    <rect width="380" height="60" rx="8" fill="#1e5f2e" stroke="#3fa057" stroke-width="1.5"/>
    <text x="18" y="26" fill="#ffffff" font-size="16" font-weight="700">✓ 已貼到 Claude Code</text>
    <text x="18" y="48" fill="#cdebd4" font-size="12">14 字 · 也在剪貼簿</text>
  </g>
  <text x="440" y="504" fill="#8b949e" font-size="13">字直接出現在你剛剛在打字的地方。</text>
  <text x="440" y="528" fill="#8b949e" font-size="13">萬一沒進去，文字一定還在剪貼簿 → 按 <tspan fill="#e6edf3" font-weight="700">Ctrl+V</tspan> 就有。</text>
</svg>
